[package]
name = "voxelcraft"
version = "0.1.0"
edition = "2024"
description = "A from-scratch Minecraft-style voxel sandbox in Rust + wgpu with ray-traced lighting"
authors = ["Jordan Birdsell <jordantbirdsell@gmail.com>"]
license = "MIT"
repository = "https://github.com/jtbirdsell/voxelcraft"
readme = "README.md"
keywords = ["voxel", "minecraft", "wgpu", "raytracing", "gamedev"]
categories = ["games", "graphics"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
crossbeam-channel = "0.5.15"
env_logger = "0.11.10"
fastnoise-lite = "1.1.1"
glam = "0.33.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.30"
lz4_flex = "0.13.1"
pollster = "0.4.0"
rustc-hash = "2.1.2"
wgpu = "29.0.3"
winit = "0.30.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Optimize dependencies even in dev builds so the engine runs smoothly while iterating.
[profile.dev.package."*"]
opt-level = 3

# A release build that keeps symbols for profiling.
[profile.profiling]
inherits = "release"
strip = "none"
debug = true

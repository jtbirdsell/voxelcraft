[package]
name = "voxelcraft"
version = "0.1.0"
edition = "2024"
description = "A from-scratch Minecraft-style voxel sandbox in Rust + wgpu with ray-traced lighting"
authors = ["Jordan Birdsell <jordantbirdsell@gmail.com>"]
license = "MIT"
repository = "https://github.com/jtbirdsell/voxelcraft"
readme = "README.md"
keywords = ["voxel", "minecraft", "wgpu", "raytracing", "gamedev"]
categories = ["games", "graphics"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
crossbeam-channel = "0.5.15"
env_logger = "0.11.10"
fastnoise-lite = "1.1.1"
glam = "0.33.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.30"
lz4_flex = "0.13.1"
pollster = "0.4.0"
# S9 audio: mixing/playback only — every sound is synthesized in code (audio/synth.rs), so the
# decoder default-features are dead weight. Pinned exact: rodio 0.21+ reworked the whole API
# (OutputStreamBuilder/mixer), so a routine bump is a deliberate migration.
rodio = { version = "=0.20.1", default-features = false }
rustc-hash = "2.1.2"
# Pinned exact: wgpu's experimental hardware-RT API breaks ~every quarterly release, so a bump
# is a deliberate mini-project (re-probe -> re-spike -> re-parity -> re-WSI), not a routine update.
# Hardware RT on the DX12 fallback needs the DXC compiler (FXC can't compile RT shaders): shipped
# dynamically as dxcompiler.dll + dxil.dll next to the exe (Dx12Compiler::Auto finds them, else
# falls back to FXC). The static-dxc feature was avoided — it links the VS ATL lib (atls.lib).
wgpu = "=29.0.3"
winit = "0.30.13"

# The DLSS-only deps live under cfg(windows) so a macOS/Linux build never resolves them into its
# target graph — plain `cargo build` (default features) works there with no NVIDIA SDK / libclang /
# Streamline. They are consumed ONLY by gfx/dlss.rs + gfx/frame_gen.rs, which compile only on Windows
# (see the src/gfx.rs gate); resolver v3 (edition 2024) keeps the `dep:`/`crate/feat` feature edges
# below inert off-target. On Windows behavior is identical to before the move.
[target.'cfg(windows)'.dependencies]
# Stable project GUID for the DLSS/NGX init (M33-G8). Base crate only (Uuid::from_u128). DLSS-only.
uuid = { version = "1", optional = true }
# dlss_wgpu_dx12's public API speaks glam 0.29 (our engine uses 0.33 — semver-incompatible). Alias
# 0.29 so the DLSS boundary in gfx/dlss.rs can name its UVec2/Vec2; convert to plain tuples for the
# rest of the engine. (M33-G8)
glam029 = { package = "glam", version = "0.29", optional = true }
# M33-G8: NVIDIA DLSS (Ray Reconstruction + Frame Generation) for the wgpu DX12 backend, via the
# raw_command_list accessor from the patched wgpu above. Windows + RTX only; degrades gracefully to
# off (native res) when the NGX DLLs/adapter are absent. **OPTIONAL + feature-gated** (M33-G9b): the
# `dlss` feature enables Ray Reconstruction (needs DLSS_SDK + LIBCLANG_PATH at build time), and
# `frame-generation` adds DLSS-G (needs STREAMLINE_SDK). `cargo build --no-default-features` builds
# WITHOUT this dep — no NVIDIA SDK / libclang / Streamline required. Pinned to the fork's release main
# (3e79f06 = v0.1.0 + the render_resolution()->optimal fix); its wgpu pin must match [patch] below.
dlss_wgpu_dx12 = { git = "https://github.com/jtbirdsell/dlss_wgpu_dx12", rev = "3e79f0693965bba4fd2329116a19a7b0a75b9f96", default-features = false, optional = true }

# M33-G9b feature gates. `dlss` (Ray Reconstruction + supersampling) and `frame-generation` (DLSS-G,
# implies dlss) are on by default; `--no-default-features` compiles the engine natively with no DLSS
# code and no NVIDIA SDK. The optional dlss_wgpu_dx12/glam029/uuid deps are pulled in only by `dlss`.
[features]
default = ["dlss", "frame-generation"]
dlss = ["dep:dlss_wgpu_dx12", "dep:glam029", "dep:uuid", "dlss_wgpu_dx12/ray-reconstruction"]
frame-generation = ["dlss", "dlss_wgpu_dx12/frame-generation"]

# `cargo run --release` is the day-to-day build. LTO off + many codegen units + incremental keeps
# relinks short on the 32-thread CPU; opt-level 3 keeps worldgen/mesher/gameplay fast. The 4090 is
# vsync-bound, so the small runtime cost vs fat-LTO is invisible in play. (One-time: switching this
# profile recompiles deps once; subsequent incremental rebuilds are much faster than the old ~50s.)
[profile.release]
opt-level = 3
lto = false
codegen-units = 256
incremental = true
panic = "abort"
strip = "debuginfo"

# Maximum-optimization build for shipping / benchmarking: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Optimize dependencies even in dev builds so the engine runs smoothly while iterating.
[profile.dev.package."*"]
opt-level = 3

# A release build that keeps symbols for profiling.
[profile.profiling]
inherits = "release"
strip = "none"
debug = true

# M33-G8 (DLSS): redirect wgpu + wgpu-hal to a pushed fork — stock v29.0.3 plus additive dx12
# patches (the `CommandEncoder::raw_command_list`/raw_device/raw_queue accessors, wgpu PR #8888, +
# a Streamline factory-upgrade for Frame Generation) that let dlss_wgpu_dx12 reach the open ID3D12
# command list and record the DLSS evaluate on our queue. Same 29.0.3 ABI, so engine code is
# unchanged. The rev MUST match dlss_wgpu_dx12's own wgpu pin so the two resolve to one wgpu.
[patch.crates-io]
wgpu = { git = "https://github.com/jtbirdsell/wgpu", rev = "d81d7552cf201d47359e993fbebc9c088142bc38" }
wgpu-hal = { git = "https://github.com/jtbirdsell/wgpu", rev = "d81d7552cf201d47359e993fbebc9c088142bc38" }
